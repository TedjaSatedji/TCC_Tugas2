<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Catatan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #f6f7fb;
      --white:    #ffffff;
      --primary:  #6c63ff;
      --primary-light: #ede9ff;
      --primary-dark:  #574fd6;
      --danger:   #ff4d6d;
      --danger-light: #fff0f3;
      --text:     #1a1a2e;
      --muted:    #9094a6;
      --border:   #e8eaf0;
      --shadow:   0 2px 12px rgba(108,99,255,0.08);
      --radius:   12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.05rem; color: var(--text);
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
    }
    .header-info {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* ── Form panel ── */
    .panel {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: sticky; top: 80px;
    }
    .panel-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .panel-title.editing { color: var(--primary); }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: none;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
      background: var(--white);
    }
    textarea { min-height: 130px; line-height: 1.6; }

    .btn-row { display: flex; gap: 8px; margin-top: 2px; }

    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 10px 20px;
      transition: all 0.15s;
    }
    .btn-save {
      background: var(--primary);
      color: white;
      flex: 1;
    }
    .btn-save:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(108,99,255,0.3); }
    .btn-save:active { transform: translateY(0); }

    .btn-cancel {
      background: var(--bg);
      color: var(--muted);
      border: 1.5px solid var(--border);
    }
    .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

    /* ── Right side ── */
    .right-col { display: flex; flex-direction: column; gap: 16px; }

    .list-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .list-title { font-weight: 700; font-size: 1.05rem; }
    .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
    }

    /* ── Note card ── */
    .note-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .note-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108,99,255,0.1);
    }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .card-title { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
    .card-date  { font-size: 0.68rem; color: var(--muted); white-space: nowrap; margin-top: 2px; flex-shrink: 0; }
    .card-preview {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.6;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 14px;
    }
    .card-footer {
      display: flex; gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .btn-sm {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 6px;
    }
    .btn-sm.edit   { background: var(--primary-light); color: var(--primary); }
    .btn-sm.edit:hover { background: #ddd8ff; }
    .btn-sm.del    { background: var(--danger-light); color: var(--danger); }
    .btn-sm.del:hover { background: #ffd6de; }

    /* ── Empty ── */
    .empty {
      background: var(--white);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .empty p { font-size: 0.88rem; }

    /* ── Modal ── */
    #modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(26,26,46,0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    #modal-bg.show { display: flex; }

    .modal-box {
      background: var(--white);
      border-radius: 16px;
      width: 100%; max-width: 520px;
      max-height: 82vh;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 60px rgba(0,0,0,0.18);
      animation: popIn 0.25s cubic-bezier(.2,.8,.4,1);
      overflow: hidden;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .modal-header h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .modal-header .modal-date { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
    .btn-close {
      background: var(--bg); border: 1.5px solid var(--border);
      width: 30px; height: 30px; border-radius: 8px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; color: var(--muted); flex-shrink: 0;
    }
    .btn-close:hover { border-color: var(--muted); color: var(--text); }

    .modal-body {
      padding: 18px 22px; overflow-y: auto; flex: 1;
      font-size: 0.9rem; line-height: 1.75; color: #444;
      white-space: pre-wrap;
    }
    .modal-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 8px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--text);
      color: white;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 0.83rem;
      font-weight: 500;
      opacity: 0; pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      .container { grid-template-columns: 1fr; }
      .panel { position: static; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📝</div>
    Catatas
  </div>
  <div class="header-info">
    Anak Agung Ngurah Sadewa Tedja<br>
    123230050 · IF-H · TCC
  </div>
</header>

<div class="container">

  <!-- Left: Form -->
  <div class="panel">
    <div class="panel-title" id="form-title">Tambah Catatan</div>
    <label for="inp-judul">Judul</label>
    <input type="text" id="inp-judul" placeholder="Judul catatan..." />
    <label for="inp-isi">Isi Catatan</label>
    <textarea id="inp-isi" placeholder="Tulis isi catatan di sini..."></textarea>
    <div class="btn-row">
      <button class="btn-save" onclick="submitNote()">Simpan</button>
      <button class="btn-cancel" id="btn-batal" style="display:none" onclick="cancelEdit()">Batal</button>
    </div>
  </div>

  <!-- Right: List -->
  <div class="right-col">
    <div class="list-header">
      <div class="list-title">Catatan Saya</div>
      <div class="badge" id="badge">...</div>
    </div>
    <div id="notes-list"></div>
  </div>

</div>

<!-- Modal -->
<div id="modal-bg" onclick="bgClose(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h3 id="m-judul"></h3>
        <div class="modal-date" id="m-date"></div>
      </div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="m-isi"></div>
    <div class="modal-footer">
      <button class="btn-sm edit" onclick="modalEdit()">Edit</button>
      <button class="btn-sm del"  onclick="modalDelete()">Hapus</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API = 'http://34.50.117.204:3000/api/notes';
  let editingId  = null;
  let activeNote = null;
  let store      = [];

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  function fmtDate(str) {
    return new Date(str).toLocaleString('id-ID', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render(notes) {
    store = notes;
    document.getElementById('badge').textContent = `${notes.length} catatan`;
    const list = document.getElementById('notes-list');

    if (!notes.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🗒️</div>
          <p>Belum ada catatan.<br>Tambahkan catatan pertama kamu!</p>
        </div>`;
      return;
    }

    list.innerHTML = notes.map(n => `
      <div class="note-card" onclick="openModal(${n.id})" style="animation-delay:${notes.indexOf(n)*0.05}s">
        <div class="card-top">
          <div class="card-title">${esc(n.judul)}</div>
          <div class="card-date">${fmtDate(n.tanggal_dibuat)}</div>
        </div>
        <div class="card-preview">${esc(n.isi)}</div>
        <div class="card-footer" onclick="event.stopPropagation()">
          <button class="btn-sm edit" onclick="startEdit(${n.id})">✏️ Edit</button>
          <button class="btn-sm del"  onclick="hapus(${n.id})">🗑️ Hapus</button>
        </div>
      </div>
    `).join('');
  }

  async function fetchNotes() {
    try {
      const r = await fetch(API);
      const j = await r.json();
      if (j.success) render(j.data);
    } catch {
      document.getElementById('badge').textContent = 'error';
      document.getElementById('notes-list').innerHTML =
        '<div class="empty"><div class="empty-icon">⚠️</div><p>Tidak bisa konek ke server.<br>Pastikan backend jalan di localhost:3000</p></div>';
    }
  }

  async function submitNote() {
    const judul = document.getElementById('inp-judul').value.trim();
    const isi   = document.getElementById('inp-isi').value.trim();
    if (!judul || !isi) { toast('Judul dan isi tidak boleh kosong!'); return; }

    try {
      const r = await fetch(editingId ? `${API}/${editingId}` : API, {
        method: editingId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ judul, isi })
      });
      const j = await r.json();
      if (j.success) { toast(j.message); resetForm(); fetchNotes(); }
      else toast(j.message);
    } catch { toast('Gagal menyimpan.'); }
  }

  function startEdit(id) {
    const n = store.find(x => x.id === id);
    if (!n) return;
    editingId = id;
    document.getElementById('inp-judul').value = n.judul;
    document.getElementById('inp-isi').value   = n.isi;
    document.getElementById('form-title').textContent = '✏️ Edit Catatan';
    document.getElementById('form-title').className   = 'panel-title editing';
    document.getElementById('btn-batal').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('inp-judul').focus();
  }

  function cancelEdit() { resetForm(); }
  function resetForm() {
    editingId = null;
    document.getElementById('inp-judul').value = '';
    document.getElementById('inp-isi').value   = '';
    document.getElementById('form-title').textContent = 'Tambah Catatan';
    document.getElementById('form-title').className   = 'panel-title';
    document.getElementById('btn-batal').style.display = 'none';
  }

  async function hapus(id) {
    if (!confirm('Yakin mau hapus catatan ini?')) return;
    try {
      const r = await fetch(`${API}/${id}`, { method: 'DELETE' });
      const j = await r.json();
      if (j.success) { toast(j.message); fetchNotes(); }
    } catch { toast('Gagal menghapus.'); }
  }

  function openModal(id) {
    const n = store.find(x => x.id === id);
    if (!n) return;
    activeNote = n;
    document.getElementById('m-judul').textContent = n.judul;
    document.getElementById('m-isi').textContent   = n.isi;
    document.getElementById('m-date').textContent  = fmtDate(n.tanggal_dibuat);
    document.getElementById('modal-bg').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal-bg').classList.remove('show');
    activeNote = null;
  }

  function bgClose(e) {
    if (e.target === document.getElementById('modal-bg')) closeModal();
  }

  function modalEdit()   { const n = activeNote; closeModal(); startEdit(n.id); }
  function modalDelete() { const id = activeNote.id; closeModal(); hapus(id); }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  fetchNotes();
</script>

</body>
</html>
